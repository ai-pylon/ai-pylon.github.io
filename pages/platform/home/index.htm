<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-template" content="1.1.0">
  <title>pylon-server — home</title>
  <script src="/appui/loader.js"></script>
  <script>AppUIAssets.loadCss();</script>
  <style>
    /* Launchpad home — page-local layout layered on the AppUI theme tokens. */
    .hp { --gap: 14px; padding: 22px 26px 40px; max-width: 1240px; margin: 0 auto; }
    .hp * { box-sizing: border-box; }

    /* hero */
    .hp-hero { position: relative; overflow: hidden; border: 1px solid var(--border);
      border-radius: var(--radius-xl, 16px); padding: 26px 28px 22px;
      background:
        radial-gradient(900px 260px at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
        radial-gradient(700px 240px at 100% 0%, color-mix(in srgb, #8b5cf6 18%, transparent), transparent 70%),
        var(--bg-elevated); }
    .hp-hello { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
    .hp-title { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.02em; color: var(--text-primary); }
    .hp-title b { background: linear-gradient(90deg, var(--accent), #8b5cf6); -webkit-background-clip: text;
      background-clip: text; color: transparent; }
    .hp-sub { font-size: 13px; color: var(--text-secondary); margin: 6px 0 18px; }
    .hp-searchrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hp-search { position: relative; flex: 1 1 420px; }
    .hp-search input { width: 100%; font-size: 15px; padding: 12px 74px 12px 42px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary);
      box-shadow: var(--shadow-sm); outline: none; transition: border-color .15s, box-shadow .15s; }
    .hp-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
    .hp-search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .6; font-size: 15px; }
    .hp-search .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
    .kbd { font: 11px var(--font-mono, ui-monospace, monospace); padding: 2px 6px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-muted); }
    .hp-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary);
      font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .hp-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* pulse tiles */
    .hp-pulse { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--gap); margin: 18px 0 6px; }
    .hp-tile { border: 1px solid var(--border); border-radius: var(--radius-lg, 12px); padding: 14px 16px;
      background: var(--bg-elevated); display: flex; flex-direction: column; gap: 2px; cursor: default;
      transition: transform .15s, border-color .15s; }
    .hp-tile.click { cursor: pointer; }
    .hp-tile.click:hover { transform: translateY(-2px); border-color: var(--accent); }
    .hp-tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .hp-tile .v { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.15; font-variant-numeric: tabular-nums; }
    .hp-tile .s { font-size: 12px; color: var(--text-secondary); }
    .hp-tile.warn .v { color: var(--color-warning, #e6a700); }
    .hp-tile.good .v { color: var(--color-success, #2e9d4f); }
    .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--color-success, #2e9d4f);
      margin-right: 6px; box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-success, #2e9d4f) 60%, transparent);
      animation: pulse 2s infinite; vertical-align: middle; }
    .live.off { background: var(--text-muted); animation: none; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    /* section headings */
    .hp-h { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; }
    .hp-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0; font-weight: 600; }
    .hp-h .line { flex: 1; height: 1px; background: var(--border); }
    .hp-h .meta { font-size: 12px; color: var(--text-muted); }
    .hp-h .seg { margin-left: 4px; }

    /* shelf (favorites + recent) */
    .hp-shelf { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .hp-mini { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); cursor: pointer;
      color: var(--text-primary); font-size: 13px; max-width: 260px; transition: border-color .15s; }
    .hp-mini:hover { border-color: var(--accent); }
    .hp-mini .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hp-mini .when { font-size: 11px; color: var(--text-muted); }
    .hp-hint { font-size: 12px; color: var(--text-muted); padding: 6px 2px; }

    /* toolbar: group chips + filters + view */
    .hp-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 2;
      padding: 10px 0; background: var(--bg-primary); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-secondary);
      font-size: 12px; cursor: pointer; user-select: none; transition: all .12s; }
    .chip:hover { color: var(--text-primary); border-color: var(--text-muted); }
    .chip.on { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }
    .chip .n { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
    .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
    .hp-bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
    .hp-bar .grow { flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: var(--bg-elevated); color: var(--text-secondary); padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .seg button.on { background: var(--accent-muted); color: var(--accent); }

    /* left-sidebar tree: groups → apps → tools, synced with the explorer */
    .at-wrap{padding:6px 4px;font-size:12px}
    .at-search{width:100%;box-sizing:border-box;margin:0 0 6px;padding:5px 8px;background:var(--bg-primary);
      color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px}
    .at-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:0 2px 6px;font-size:11px;color:var(--text-muted)}
    .at-crumbs a,.at-empty a{color:var(--accent);cursor:pointer;text-decoration:none}.at-crumbs a:hover{text-decoration:underline}
    .at-crumbs b{color:var(--text-primary);font-weight:600}.at-crumbs .sep{opacity:.6}
    /* content view for an app/group the tool catalog doesn't list (no LLM tools) */
    .hp-miss{padding:6px 4px;font-size:13px;display:flex;flex-direction:column;gap:8px}
    .hp-miss-h{font-size:16px;font-weight:600}.hp-miss .muted{color:var(--text-muted);font-weight:400;font-size:12px}
    .hp-miss-d{color:var(--text-secondary);line-height:1.45}
    .hp-miss-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .hp-miss-a .btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);
      color:var(--text-primary);font-size:12px;cursor:pointer;text-decoration:none}
    .hp-miss-a .btn.primary{background:var(--accent);color:var(--text-inverse);border-color:transparent}
    .hp-miss-a .ok{color:var(--color-success,#4caf50);font-size:12px}.hp-miss-a .bad{color:var(--color-warning,#d92d3a);font-size:12px}
    .hp-miss-op{padding:5px 2px;border-bottom:1px solid var(--border)}.hp-miss-op a{color:var(--accent);cursor:pointer}
    .at-row{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:var(--radius-sm);cursor:pointer;
      color:var(--text-primary);white-space:nowrap}
    .at-row:hover{background:var(--bg-active)}
    .at-row.sel{background:var(--accent-muted);color:var(--accent)}
    .at-row.ctx{outline:1px solid var(--accent);outline-offset:-1px}
    .at-row.grp{color:var(--text-secondary);font-weight:600}
    .at-tw{display:inline-block;width:10px;flex:0 0 auto;color:var(--text-muted);transition:transform .12s;text-align:center}
    .at-tw.open{transform:rotate(90deg)}
    .at-tw.none{visibility:hidden}
    .at-cnt{color:var(--text-muted);font-weight:400;font-size:11px}
    .at-row .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--text-muted)}
    .at-row .dot.ready{background:#4caf50}
    .at-row .dot.bad{background:#d92d3a}
    .at-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .at-row .pg{font-size:10px;color:var(--accent);flex:0 0 auto;text-decoration:none;padding:0 3px}
    .at-row.tool{color:var(--text-secondary);font-family:var(--font-mono,ui-monospace,monospace);font-size:11px}
    .at-row.tool .w{font-size:9px;color:var(--color-warning,#b7791f)}
    .at-kids{margin-left:10px}
    .at-empty{color:var(--text-muted);padding:8px}

    /* explorer region + app quick matches */
    .hp-qm { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
    .hp-qm .lbl { flex: 0 0 auto; align-self: center; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
    .hp-mini.top1 { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
    .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--bg-hover); color: var(--text-secondary); white-space: nowrap; }
    .tag.ok { background: color-mix(in srgb, var(--color-success, #2e9d4f) 15%, transparent); color: var(--color-success, #2e9d4f); }
    .tag.bad { background: color-mix(in srgb, var(--color-warning, #e6a700) 18%, transparent); color: var(--color-warning, #b7791f); }
    .tag.ai { background: color-mix(in srgb, #8b5cf6 16%, transparent); color: #8b5cf6; }
    .ic { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px;
      background: color-mix(in srgb, var(--hue) 16%, transparent); border: 1px solid color-mix(in srgb, var(--hue) 30%, transparent); }
    .hp-mini .ic { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
    .vx-act.star { font-size: 15px; font-weight: 400; color: var(--text-muted); padding: 1px 5px; }
    .vx-act.star.on, .vx-act.star:hover { color: #f5b400; border-color: transparent; }
    /* Try-it panel on a tool leaf */
    .try { border-top: 1px dashed var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .try .row { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 6px 10px; align-items: center; }
    .try label { font: 12px var(--font-mono, ui-monospace, monospace); color: var(--text-primary); }
    .try input { padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary);
      color: var(--text-primary); font-size: 12px; }
    .try .out { white-space: pre-wrap; font: 12px/1.5 var(--font-mono, ui-monospace, monospace); background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 420px; overflow: auto; margin: 0; }
    .try .meta { font-size: 11px; color: var(--text-muted); }
    .hp-empty { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 14px; }
    .hp-empty .big { font-size: 34px; margin-bottom: 6px; }

    /* endpoints */
    .hp-eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--gap); }
    .ep { border: 1px solid var(--border); border-radius: var(--radius-lg, 12px); background: var(--bg-elevated); padding: 14px; }
    .ep .h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .ep .h .nm { font-weight: 600; color: var(--text-primary); }
    .ep .h .sub { font-size: 12px; color: var(--text-muted); }
    .ep .h .grow { flex: 1; }
    .ep .caps { display: flex; flex-direction: column; gap: 6px; }
    .ep .cg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .ep .cg .lbl { font-size: 11px; color: var(--text-muted); width: 72px; flex: 0 0 auto; }

    /* details dialog body */
    .dd { font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow: auto; }
    .dd .hdr { display: flex; gap: 12px; align-items: center; }
    .dd .hdr .t { font-size: 17px; font-weight: 700; color: var(--text-primary); }
    .dd .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; }
    .dd .ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
    .dd .op { border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; background: var(--bg-secondary); }
    .dd .op .n { font: 600 12px var(--font-mono, ui-monospace, monospace); color: var(--text-primary); }
    .dd .op .f { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; }
    .dd .op .p { font-size: 11px; margin-top: 4px; color: var(--text-secondary); }
    .dd code { font-size: 11px; background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; }
    .dd ul { margin: 0; padding-left: 18px; }
    .dd .acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .dd .opfilter { width: 100%; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-primary); color: var(--text-primary); font-size: 12px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .hp { padding: 14px 12px 30px; }
      .hp-title { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { .hp-tile, .live { transition: none; animation: none; } }
  </style>
</head>
<body data-auto-init="false" data-page-id="platform-home" data-page-title="pylon-server">
  <nav id="app-menubar" class="ai-app-menu" aria-label="Application menu"></nav>
  <div id="app-main" class="ai-app-main">
    <aside id="app-left" class="ai-app-left" aria-label="Left sidebar"></aside>
    <main id="app-content" class="ai-app-content content-layout" aria-label="Application content">
      <div id="app-content-top" class="content-top"></div>
      <div id="app-content-body" class="content-body"></div>
      <div id="app-content-bottom" class="content-bottom"></div>
    </main>
    <aside id="app-right" class="ai-app-right" aria-label="Right sidebar"></aside>
  </div>
  <footer id="app-statusbar" class="ai-app-status" aria-label="Application status"></footer>

  <script>
    // On-the-fly bundles: one request per named bundle (framework/bundler.py).
    window.APPUI_BUNDLES = window.APPUI_BUNDLES || {};
    ['foundation','shell','palette','visExplorer','contextMenu'].forEach(function(b){
      window.APPUI_BUNDLES[b] = '/appui/bundle/' + b + '.js';
    });
  </script>
  <script>window.AppUIReady = AppUIAssets.load('foundation', 'shell');</script>
  <script src="assets/home.js?v=10&amp;pa=1"></script>
</body>
</html>
