<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="app-template" content="1.1.0">
<title>Accounts · Pylon</title><script src="/appui/loader.js"></script><script>AppUIAssets.loadCss();</script><link rel="stylesheet" href="assets/accounts.css?v=1"></head>
<body data-auto-init="false" data-page-id="platform-accounts" data-page-title="Accounts">
<nav id="app-menubar" class="ai-app-menu"></nav><div id="app-main" class="ai-app-main"><aside id="app-left" class="ai-app-left"></aside><main id="app-content" class="ai-app-content content-layout"><div id="app-content-top" class="content-top"></div><div id="app-content-body" class="content-body"></div><div id="app-content-bottom" class="content-bottom"></div></main><aside id="app-right" class="ai-app-right"></aside></div><footer id="app-statusbar" class="ai-app-status"></footer>
<template id="accounts-template"><div class="accounts-wrap">
<header><div class="eyebrow">Settings / Security</div><h1>Accounts</h1><p>Choose how you sign in to Pylon. Deployment credentials are managed separately.</p></header>
<div id="account-message" role="status" aria-live="polite"></div>
<section class="account-card"><div class="card-head"><div><h2>Owner account</h2><p>Your primary sign-in method and recovery option.</p></div><span id="owner-state" class="state">Checking…</span></div>
<form id="owner-form" method="post" hidden><div class="fields"><label>Owner ID<input name="admin_user" autocomplete="username" maxlength="64" required pattern="[A-Za-z0-9_.-]{1,64}"></label><label id="current-field">Current password<input name="current_password" type="password" autocomplete="current-password"></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label></div><p class="muted">Use at least 12 characters. Saving signs you out so you can confirm your new password.</p><button class="primary" id="save-owner" type="submit">Save owner account</button></form></section>
<section class="account-card"><div class="card-head"><div><h2>Connected sign-in methods</h2><p>Connect your own accounts for one-click sign-in. No external account is granted access automatically.</p></div></div><div id="provider-list"></div></section>
<p><a href="/apps/platform/settings/">Back to Settings</a></p></div></template>
<script>window.APPUI_BUNDLES=window.APPUI_BUNDLES||{};["foundation","shell"].forEach(function(b){window.APPUI_BUNDLES[b]="/appui/bundle/"+b+".js";});window.AppUIReady=AppUIAssets.load("foundation","shell");</script><script src="assets/accounts.js?v=4"></script></body></html>
