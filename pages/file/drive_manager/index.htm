<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-template" content="1.1.0"><title>Drive Manager — pylon-server</title>
<script src="/appui/loader.js"></script><script>AppUIAssets.loadCss();</script>
<link rel="stylesheet" href="assets/workspace.css?v=2"></head>
<body data-auto-init="false" data-page-id="file-drive_manager" data-page-title="Drive Manager">
<nav id="app-menubar" class="ai-app-menu" aria-label="Application menu"></nav>
<div id="app-main" class="ai-app-main"><aside id="app-left" class="ai-app-left" aria-label="Left sidebar"></aside><main id="app-content" class="ai-app-content content-layout" aria-label="Application content"><div id="app-content-top" class="content-top"></div><div id="app-content-body" class="content-body"></div><div id="app-content-bottom" class="content-bottom"></div></main><aside id="app-right" class="ai-app-right" aria-label="Right sidebar"></aside></div>
<footer id="app-statusbar" class="ai-app-status" aria-label="Application status"></footer>
<template id="dm-side-template"><div class="dm-ui" style="height:100%;min-height:0"><aside class="sidebar" id="folderSidebar" aria-label="Google Drive 폴더 탐색기"><h3>📁 내 드라이브 <button id="refreshTree" title="폴더 새로고침" style="float:right;padding:2px 6px">↻</button></h3><div id="tree" role="tree"></div><div class="gallery-sidebar"><h3>🖼️ 갤러리 <button id="galleryNavRefresh" title="갤러리 목록 갱신" style="float:right;padding:2px 6px">↻</button></h3><div id="galleryTree" role="navigation" aria-label="갤러리 탐색"></div></div></aside></div></template>
<template id="dm-content-template"><div class="dm-ui"><div class="dm-main"><div class="dm-toolbar-head"><div class="toolbar"><h1>Drive Manager</h1></div><div class="toolbar"><span id="identity" class="muted"></span><button id="authButton" class="accent">Google 로그인</button></div><a id="dmOverview" href="overview.htm">인덱스 · 상태</a></div><div id="workspace"><section class="tree-panel"><div class="toolbar"><strong id="folderTitle">앨범</strong><input id="search" type="search" placeholder="현재 폴더 검색" aria-label="파일 및 폴더 검색"><select id="sort"><option value="name">이름순</option><option value="nameDesc">이름 역순</option><option value="dateDesc">최신순</option><option value="date">오래된순</option></select><button id="viewMode">☷ 목록</button><button id="selectMode" type="button" aria-pressed="false">☑ 선택</button><button id="favoriteOnly">♡ 즐겨찾기</button><button id="timeline">▤ 날짜별</button><button id="duplicates">⧉ 중복 검사</button><button id="organizeExisting">▤ 기존 사진 정리</button><button id="manageShares">공유 관리</button><button id="workerPair">🖥 PC 작업자 연결</button><button id="projectHubOpen" title="프로젝트 대시보드">🗂 프로젝트</button><button id="shareFolder">🔗 폴더 공유</button><button id="newFolder">＋ 폴더</button><button id="uploadOpen">↑ 업로드</button><button id="reload">새로고침</button><span id="selectionActions"><span id="selectionCount"></span><button id="downloadSelected">선택 다운로드</button><button id="clearSelected">선택 해제</button></span></div><nav id="breadcrumbs" aria-label="폴더 경로"></nav><p id="status" class="muted"></p><div id="dropZone"><div id="dropOverlay">⬆ 이 폴더에 파일 업로드</div><div id="dropHint">파일을 이 영역으로 드래그하면 현재 폴더에 업로드할 수 있습니다.</div><div id="albumCards"></div><div id="galleryHome" style="display:none"></div><div id="indexedPanel" style="display:none"></div><div id="gallery"></div></div><button id="loadMore">더 보기</button></section></div></div></div></template>
<div id="dm-overlays" class="dm-ui"><div id="treeContextMenu" role="menu" aria-label="폴더 메뉴"></div><div id="organizeDialog" style="display:none;position:fixed;inset:0;background:#05070ce8;z-index:8;align-items:center;justify-content:center"><div style="background:var(--bg-elevated);padding:24px;border-radius:14px;width:min(94vw,650px);max-height:85vh;overflow:auto"><h2>기존 사진 자동 정리</h2><p class="muted">현재 폴더의 사진을 촬영일 또는 Drive 생성일 기준으로 연도/월 하위 폴더로 이동합니다. 샘플 파일을 먼저 확인하고 전체 정리를 별도로 실행합니다.</p><label style="display:flex;gap:9px;align-items:center;margin:12px 0"><input type="checkbox" id="organizeRecursive"> 하위 폴더까지 포함하여 정리</label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0"><label>폴더 구조<select id="organizeLayout"><option value="year-month">연도 / 월</option><option value="year">연도만</option><option value="flat-month">연도-월 (한 폴더)</option></select></label><label>정리 대상<select id="organizeTypes"><option value="both">사진 + 동영상</option><option value="image">사진만</option><option value="video">동영상만</option></select></label><label>날짜 기준<select id="organizeDate"><option value="capture">촬영일 우선, 없으면 생성일</option><option value="created">Drive 생성일만</option></select></label></div><label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="organizeSkipStructured" checked> 이미 연도/월로 정리된 폴더는 건너뛰기</label><div style="display:flex;align-items:center;gap:12px;margin:10px 0"><label>예시 개수 <select id="organizeSampleCount"><option value="5">5개</option><option value="10" selected>10개</option><option value="20">20개</option></select></label><button type="button" id="organizeShowAll">전체 예상 결과 보기</button></div><div id="organizePreview" style="max-height:300px;overflow:auto"></div><p id="organizeStatus"></p><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="organizeConfirm"> 예시를 확인했으며 전체 대상에 적용하는 데 동의합니다</label><button id="organizeApply" class="accent" disabled>전체 대상 정리 실행</button> <button id="organizeClose">닫기</button></div></div><div id="uploadDialog" style="display:none;position:fixed;inset:0;background:#05070ce8;z-index:7;align-items:center;justify-content:center"><div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:24px;width:min(94vw,560px);max-height:90vh;overflow:auto"><h2>파일 업로드</h2><input id="uploadFiles" type="file" multiple style="max-width:100%"><p><label><input id="autoOrganize" type="checkbox"> 촬영 날짜 기준 연도/월 폴더 자동 정리</label></p><p class="muted">JPEG EXIF 촬영일을 우선 사용하며 없으면 파일 수정일을 사용합니다. 기존 파일은 이동하지 않습니다. 파일당 최대 5GB. 중단된 업로드는 같은 파일을 다시 선택하면 이어서 전송합니다.</p><div id="uploadPreview" style="max-height:200px;overflow:auto"></div><p id="uploadStatus" class="muted"></p><div class="toolbar"><button id="uploadStart" class="accent">업로드 실행</button><button id="uploadClose">취소</button></div></div></div><div id="viewer" role="dialog" aria-label="사진 보기"><button id="close">닫기 ✕</button><button id="prev" aria-label="이전 사진">❮</button><button id="next" aria-label="다음 사진">❯</button><div id="content"></div><div id="filmstrip"></div><p id="caption"></p><div class="toolbar"><button id="favCurrent">♡ 즐겨찾기</button><button id="zoom">확대</button></div></div></div>
<script>window.APPUI_BUNDLES=window.APPUI_BUNDLES||{};['foundation','shell'].forEach(b=>window.APPUI_BUNDLES[b]='/appui/bundle/'+b+'.js');window.AppUIReady=AppUIAssets.load('foundation','shell');</script>
<script src="assets/workspace.js?v=7"></script>
</body></html>
